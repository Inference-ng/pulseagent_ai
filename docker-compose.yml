version: "3.9"

services:

  # ── AI Agent Service (Emmanuel) ──────────────────────────────
  ai-agent:
    build:
      context: ./apps/ai-agent
      dockerfile: Dockerfile
    container_name: pulseagent-ai-agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ./data:/app/data          # Shared dataset volume
    networks:
      - pulseagent-net
    restart: unless-stopped

  # ── Backend API Service (Nwokedi) ────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: pulseagent-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./pulseagent.db}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./data:/app/data          # Shared dataset volume
      - ./apps/ai-agent:/ai-agent # Backend imports AI agent module
    depends_on:
      - ai-agent
    networks:
      - pulseagent-net
    restart: unless-stopped

  # ── Frontend Dashboard (Victor) ──────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: pulseagent-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - pulseagent-net
    restart: unless-stopped

  # ── PostgreSQL Database (Optional — comment out for SQLite) ──
  # db:
  #   image: postgres:16-alpine
  #   container_name: pulseagent-db
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: pulseagent
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - pulseagent-net

networks:
  pulseagent-net:
    driver: bridge

